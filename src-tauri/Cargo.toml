[package]
name = "duovra"
version = "0.3.0"
description = "Duovra: an open-source desktop workspace for Claude Code and OpenAI Codex"
edition = "2021"
publish = false
license = "MIT"
repository = "https://github.com/yagues1/duovra"

[lib]
name = "studio_lib"
crate-type = ["rlib"]

[features]
qa-loopback = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
tokio = { version = "1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
uuid = { version = "1", features = ["v4"] }
anyhow = "1"
which = "8"
dirs = "6"
parking_lot = "0.12"
tauri-plugin-updater = "~2.14.1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
