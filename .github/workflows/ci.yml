name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Minimal permissions: CI only reads the repository. No secrets are used, so pull requests
# from forks run with the same (read-only) token.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · typecheck, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    name: Windows · Rust tests and unsigned build
    runs-on: windows-2025
    needs: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build:windows -- --unsigned
      - name: Verify package hashes
        id: packages
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $directory = "output/distribution/Duovra-$version-unsigned"
          Get-Content (Join-Path $directory 'SHA256SUMS.txt') | ForEach-Object {
            $expected, $name = $_ -split '  ', 2
            $computed = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $directory $name)).Hash
            if ($computed -ine $expected) { throw "SHA-256 mismatch for $name" }
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "directory=$directory" >> $env:GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with:
          name: Duovra-${{ steps.packages.outputs.version }}-windows-x64-unsigned
          path: ${{ steps.packages.outputs.directory }}/*
          if-no-files-found: error
          retention-days: 7
