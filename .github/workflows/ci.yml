name: QA aislada de Duovra 1.0.8

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Fase de verificación
        type: choice
        options: [baseline, packages, public]
        required: true
      signed_run:
        description: ID del workflow oficial de firma
        type: string
        required: false
      runner:
        description: Imagen desechable de Windows
        type: choice
        options: [windows-2022, windows-2025]
        default: windows-2022

permissions:
  contents: read
  actions: read

jobs:
  update:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Comprobar WebView2 Evergreen en el runner
        shell: pwsh
        run: |
          $client = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $runtime = Get-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client","HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client" -Name pv -ErrorAction SilentlyContinue
          if (-not ($runtime | Where-Object { $_.pv -and $_.pv -ne '0.0.0.0' })) {
            $setup = Join-Path $env:RUNNER_TEMP MicrosoftEdgeWebView2Setup.exe
            curl.exe -fsSL 'https://go.microsoft.com/fwlink/p/?LinkId=2124703' -o $setup
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo descargar el runtime de Microsoft' }
            $signature = Get-AuthenticodeSignature -LiteralPath $setup
            if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'Microsoft Corporation') { throw 'Firma inválida en el instalador WebView2' }
            $process = Start-Process -FilePath $setup -ArgumentList '/silent','/install' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "WebView2 setup: $($process.ExitCode)" }
          }
          Get-ItemProperty -Path "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$client","HKCU:\Software\Microsoft\EdgeUpdate\Clients\$client" -Name pv -ErrorAction SilentlyContinue | Select-Object pv
          Get-Process -Id $PID | Select-Object ProcessName,SessionId
      - name: Descargar la versión instalada de prueba
        shell: pwsh
        run: |
          gh release download v1.0.7 -R yagues1/duovra -D output/baseline -p '*setup.exe'
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Descargar artefactos del workflow firmado
        if: inputs.phase == 'packages'
        shell: pwsh
        run: |
          if ($env:SIGNED_RUN -cnotmatch '^\d+$') { throw 'Falta el ID del workflow firmado' }
          gh run download $env:SIGNED_RUN -R yagues1/duovra -n Duovra-1.0.8-windows-x64 -D output/signed
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED_RUN: ${{ inputs.signed_run }}
      - name: Conservar la instrumentación de WebView2 al reabrir
        if: inputs.phase == 'public'
        shell: pwsh
        run: |
          $webview = 'HKCU:\Software\Policies\Microsoft\Edge\WebView2'
          $arguments = Join-Path $webview 'AdditionalBrowserArguments'
          $data = Join-Path $webview 'UserDataFolder'
          New-Item $arguments,$data -Force | Out-Null
          foreach ($appId in 'duovra.exe','dev.duovra.studio.beta') {
            New-ItemProperty -Path $arguments -Name $appId -Value '--remote-debugging-address=127.0.0.1 --remote-debugging-port=19333' -Force | Out-Null
            New-ItemProperty -Path $data -Name $appId -Value (Join-Path $PWD 'output/webview') -Force | Out-Null
          }
      - name: Verificar instalación y persistencia
        run: node scripts/qa/release-108-windows.mjs $env:QA_PHASE
        env:
          QA_PHASE: ${{ inputs.phase }}
      - name: Estado del visor si falla la prueba
        if: failure()
        shell: pwsh
        run: |
          Get-Process duovra,msedgewebview2 -ErrorAction SilentlyContinue | Select-Object ProcessName,SessionId,Path
          Get-Item output/installed/duovra.exe -ErrorAction SilentlyContinue | ForEach-Object { $_.VersionInfo | Format-List ProductVersion,FileVersion }
          Get-ChildItem output/installed -ErrorAction SilentlyContinue | Format-Table Name,LastWriteTime
          Get-ChildItem output/webview -ErrorAction SilentlyContinue | Select-Object Name
          Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5); Level=2} -ErrorAction SilentlyContinue | Select-Object -First 6 | Format-List ProviderName,Message
      - uses: actions/upload-artifact@v4
        if: success() && inputs.phase == 'packages'
        with:
          name: Duovra-1.0.8-Appearance
          path: output/appearance/*.png
          retention-days: 7
