name: Preparar release firmada de Windows

on:
  workflow_dispatch:
    inputs:
      version:
        description: Versión estable que coincide con los manifiestos
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: windows-2025
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verificar la versión solicitada
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -cne $env:RELEASE_VERSION) { throw "La versión solicitada debe coincidir con package.json" }
      - run: npm ci
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - run: npm run build:windows
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Duovra-${{ inputs.version }}-windows-x64
          path: output/distribution/Duovra-${{ inputs.version }}/*
          if-no-files-found: error
          retention-days: 14
